<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts and Modals</title>
</head>
<body>

    <h1>Alerts and Modals</h1>

    <button id="open-alert">Open Alert</button>
    <button id="open-modal">Open Modal</button>

    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5);">
        <div style="background-color:white; margin:10% auto; padding:20px; width:50%;">
            <h2>Modal Title</h2>
            <p>This is a sample modal.</p>
            <button id="close-modal">Close Modal</button>
        </div>
    </div>

    <script>

        // https://livecode.codeadam.ca/

        // When open-alert is clicked display a JavaScript alert
        // When open-modal is clicked display modal (change display to block)
        // When close-modal is clicked hid the modal

        let openAlert = document.getElementById("open-alert");
        let openModal = document.getElementById("open-modal");
        let closeModal = document.getElementById("close-modal");
        let modal = document.getElementById("modal");

        openAlert.addEventListener("click", function(){

            alert("This is a JavaScript alert");

        });

        openModal.addEventListener("click", function(){

            modal.style.display = "block";

        });

        closeModal.addEventListener("click", function(){

            modal.style.display = "none";

        });

    </script>

</body>
</html>
