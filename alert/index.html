<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts and Modals</title>
</head>
<body>

    <button id="alert">Open Alert</button>
    <button id="openModal">Open Modal</button>
    
    <!-- Add a modal with a greyed out background -->
     <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5);">
         <div style="position:relative; margin:10% auto; padding:20px; background:white; width:300px; text-align:center;">
             <p>This is a modal message!</p>
             <button id="closeModal">Close</button>
         </div>
     </div>

    <script>

        let alertButton = document.getElementById("alert");
        alertButton.addEventListener("click", function(){

            alert('This is my message!');

        });

        let openModal = document.getElementById("openModal");
        let modal = document.getElementById("modal");
        let closeModal = document.getElementById("closeModal");

        openModal.addEventListener("click", function(){
            modal.style.display = "block";
        });

        closeModal.addEventListener("click", function(){
            modal.style.display = "none";
        });

    </script>

</body>
</html>
