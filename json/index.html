<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Greeting</title>
</head>
<body>

    <h1>Random Greeting</h1>

    <button id="get-greeting">Greet Me Please!</button>
    <div id="greeting"></div>
    
    <script>

        let getGreeting = document.getElementById("get-greeting");
        let greeting = document.getElementById("greeting");
        let greetingList;

        async function fetchGreetings() {

            const response = await fetch("greetings.json");
            console.log(response);

            const data = await response.json();
            console.log(data);

            greetingList = data.greetings;
            console.log(greetingList);

        }

        fetchGreetings();

        getGreeting.addEventListener("click", function(){
           
            alert(greetingList[2]);

        });

        /*
        - Change the topic, don't use greetings
        - On click display a random item
        - Display the item in the DOM
        */

    </script>

</body>
